name: Cleanup old workflow runs
on:
  schedule:
    - cron: '0 3 * * *'   # varje natt 03:00 UTC
  workflow_dispatch:        # så du kan trigga manuellt också

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete runs older than 30 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -d '30 days ago' -u +%Y-%m-%dT%H:%M:%SZ)
          gh run list --repo "$REPO" --limit 500 --json databaseId,createdAt \
            --jq ".[] | select(.createdAt < \"$cutoff\") | .databaseId" \
          | xargs -r -I{} gh run delete {} --repo "$REPO"