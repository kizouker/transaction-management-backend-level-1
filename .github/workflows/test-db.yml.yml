name: Test database schema

on: [push, pull_request]

jobs:
  test-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create database from schema
        run: sqlite3 test.db < sql/schema.sql

      - name: Verify tables exist
        run: |
          TABLES=$(sqlite3 test.db ".tables")
          echo "$TABLES"
          echo "$TABLES" | grep -q "bank_account" || exit 1
          echo "$TABLES" | grep -q "money_transfer" || exit 1

      - name: Run test inserts/queries
        run: sqlite3 test.db < sql/load_test.sql