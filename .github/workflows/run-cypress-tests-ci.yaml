name: CI

on:
  push:
    branches: [ pre-test-transactions ]
  pull_request:
    branches: [  pre-test-transactions]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test